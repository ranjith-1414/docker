<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cinema·verse | book tickets</title>
    <!-- Google Fonts for a modern, stylish look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #0b0d15 0%, #141824 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #f0f3fa;
        }

        .glass-card {
            background: rgba(20, 24, 36, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 3.5rem;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            width: 100%;
            max-width: 1000px;
            padding: 2.5rem;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.25rem;
        }

        h1 i {
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2.4rem;
        }

        .subhead {
            font-size: 1rem;
            font-weight: 300;
            color: #a0a8c0;
            margin-bottom: 2rem;
            border-left: 3px solid #ff6b9d;
            padding-left: 1rem;
            letter-spacing: 0.3px;
        }

        /* Movie selection row — stylish pills */
        .movie-pills {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #b7bed6;
            letter-spacing: 0.2px;
        }

        .pill i {
            font-size: 1rem;
            color: #ff6b9d;
        }

        .pill.active {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(192, 132, 252, 0.2));
            border-color: rgba(255, 107, 157, 0.5);
            color: white;
            box-shadow: 0 4px 15px -5px rgba(255, 107, 157, 0.4);
        }

        .pill:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Main layout: cinema screen + seats side */
        .booking-area {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr;
            gap: 2.5rem;
        }

        /* Cinema screen and seats */
        .screen-section {
            display: flex;
            flex-direction: column;
        }

        .screen-curve {
            background: linear-gradient(to bottom, #3b4058, #1e212f);
            height: 12px;
            width: 90%;
            margin: 0 auto 2rem;
            border-radius: 50% / 100% 100% 0 0;
            box-shadow: 0 0 30px rgba(255, 107, 157, 0.3), 0 8px 20px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .screen-curve::after {
            content: "SCREEN";
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 6px;
            font-weight: 600;
            color: #5b6380;
            white-space: nowrap;
        }

        .seats-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 0.7rem;
            justify-content: center;
            padding: 1rem 0 0.5rem;
        }

        .seat {
            aspect-ratio: 1 / 1;
            background: #262c3e;
            border-radius: 12px 12px 8px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: #6b7290;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 4px 0 #0e1018;
            user-select: none;
            position: relative;
        }

        .seat:not(.occupied):hover {
            background: #3b425e;
            color: white;
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .seat.selected {
            background: linear-gradient(145deg, #ff6b9d, #c084fc);
            color: white;
            box-shadow: 0 0 15px #ff6b9d, 0 4px 0 #8a3f5e;
            border-color: rgba(255, 255, 255, 0.4);
            font-weight: 700;
        }

        .seat.occupied {
            background: #1a1d28;
            color: #3e4359;
            cursor: not-allowed;
            box-shadow: 0 2px 0 #0b0d12;
            border-color: rgba(255, 255, 255, 0.02);
            opacity: 0.7;
        }

        /* Right panel — booking summary & action */
        .summary-panel {
            background: rgba(12, 15, 24, 0.6);
            border-radius: 2.5rem;
            padding: 2rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 25px -10px rgba(0, 0, 0, 0.5);
        }

        .summary-panel h3 {
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9aa1bd;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .summary-panel h3 i {
            color: #ff6b9d;
        }

        .booking-detail {
            display: flex;
            justify-content: space-between;
            padding: 0.9rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1rem;
            color: #cbd0e6;
        }

        .booking-detail span:first-child {
            font-weight: 400;
            color: #8b91aa;
        }

        .booking-detail span:last-child {
            font-weight: 600;
            color: white;
        }

        .seat-list {
            max-height: 90px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            padding: 0.5rem 0;
        }

        .seat-tag {
            background: rgba(255, 107, 157, 0.2);
            border: 1px solid rgba(255, 107, 157, 0.5);
            border-radius: 40px;
            padding: 0.2rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #ffb8d2;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .total-row .label {
            font-size: 1.2rem;
            font-weight: 500;
            color: #b7bed6;
        }

        .total-row .amount {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffb86b, #ff6b9d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }

        .btn-book {
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            border: none;
            border-radius: 60px;
            padding: 1.2rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            box-shadow: 0 10px 25px -5px #ff6b9d80;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-book:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px -5px #ff6b9dcc;
            background: linear-gradient(135deg, #ff7da8, #ca94ff);
        }

        .btn-book:active {
            transform: scale(0.98);
        }

        .btn-book i {
            font-size: 1.2rem;
        }

        .legend {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #7e85a0;
            font-weight: 500;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-box {
            width: 16px;
            height: 16px;
            border-radius: 6px;
            background: #262c3e;
            box-shadow: 0 2px 0 #0e1018;
        }

        .legend-box.selected {
            background: linear-gradient(145deg, #ff6b9d, #c084fc);
            box-shadow: 0 0 8px #ff6b9d;
        }

        .legend-box.occupied {
            background: #1a1d28;
            opacity: 0.5;
        }

        /* responsiveness */
        @media (max-width: 800px) {
            .glass-card {
                padding: 1.8rem;
                border-radius: 2.5rem;
            }
            .booking-area {
                grid-template-columns: 1fr;
                gap: 1.8rem;
            }
            .seats-grid {
                gap: 0.5rem;
            }
            h1 {
                font-size: 2rem;
            }
            .summary-panel {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .seats-grid {
                grid-template-columns: repeat(6, 1fr);
            }
            .pill {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
            .screen-curve::after {
                font-size: 0.6rem;
                letter-spacing: 4px;
            }
        }

        /* subtle animation */
        @keyframes glowPulse {
            0% { box-shadow: 0 0 5px rgba(255, 107, 157, 0.5); }
            50% { box-shadow: 0 0 20px rgba(255, 107, 157, 0.9); }
            100% { box-shadow: 0 0 5px rgba(255, 107, 157, 0.5); }
        }

        .seat.selected {
            animation: glowPulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>
            <i class="fas fa-film"></i> cinema·verse
        </h1>
        <div class="subhead">
            <i class="fas fa-map-pin" style="margin-right: 8px;"></i> select your seats · book instantly
        </div>

        <!-- Movie selector (pills) -->
        <div class="movie-pills">
            <div class="pill active" data-movie="Dune: Part Two">
                <i class="fas fa-meteor"></i> Dune: Part Two
            </div>
            <div class="pill" data-movie="Oppenheimer">
                <i class="fas fa-atom"></i> Oppenheimer
            </div>
            <div class="pill" data-movie="Poor Things">
                <i class="fas fa-dragon"></i> Poor Things
            </div>
            <div class="pill" data-movie="The Batman">
                <i class="fas fa-mask"></i> The Batman
            </div>
        </div>

        <!-- main booking area -->
        <div class="booking-area">
            <!-- left: screen + seats -->
            <div class="screen-section">
                <div class="screen-curve"></div>
                <div class="seats-grid" id="seatsGrid">
                    <!-- seats will be generated with JS -->
                </div>
                <!-- legend -->
                <div class="legend">
                    <div class="legend-item"><div class="legend-box"></div> available</div>
                    <div class="legend-item"><div class="legend-box selected"></div> selected</div>
                    <div class="legend-item"><div class="legend-box occupied"></div> occupied</div>
                </div>
            </div>

            <!-- right: booking summary -->
            <div class="summary-panel">
                <h3><i class="fas fa-ticket-alt"></i> your booking</h3>
                <div class="booking-detail">
                    <span>Movie</span>
                    <span id="movieName">Dune: Part Two</span>
                </div>
                <div class="booking-detail">
                    <span>Showtime</span>
                    <span>Today · 7:30 PM</span>
                </div>
                <div class="booking-detail" style="border-bottom: none; padding-bottom: 0.2rem;">
                    <span>Selected seats</span>
                    <span id="seatCount">0</span>
                </div>
                <div class="seat-list" id="seatList">
                    <!-- selected seat tags will appear here -->
                </div>
                <div class="total-row">
                    <span class="label">Total</span>
                    <span class="amount" id="totalAmount">$0</span>
                </div>
                <button class="btn-book" id="bookBtn">
                    <i class="fas fa-credit-card"></i> Book now
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- STATE ----------
            const rows = 6;
            const cols = 8;
            const seatPrice = 12; // base price per seat
            const occupiedSeats = new Set([
                '1-3', '1-4', '2-6', '3-2', '3-7', '4-5', '5-1', '5-8', '6-4', '6-5'
            ]); // some pre-occupied seats for realism

            let selectedSeats = new Set(); // stores "row-col" strings

            // DOM elements
            const seatsGrid = document.getElementById('seatsGrid');
            const seatCountSpan = document.getElementById('seatCount');
            const seatListDiv = document.getElementById('seatList');
            const totalAmountSpan = document.getElementById('totalAmount');
            const bookBtn = document.getElementById('bookBtn');
            const movieNameSpan = document.getElementById('movieName');
            const moviePills = document.querySelectorAll('.pill');

            // helper: format seat label like "A1"
            function seatLabel(row, col) {
                const rowLetter = String.fromCharCode(65 + row); // A, B, C...
                return `${rowLetter}${col + 1}`;
            }

            // ---------- RENDER SEATS ----------
            function renderSeats() {
                seatsGrid.innerHTML = '';
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const seatId = `${r}-${c}`;
                        const seatDiv = document.createElement('div');
                        seatDiv.className = 'seat';
                        // add occupied class if in occupied set
                        if (occupiedSeats.has(seatId)) {
                            seatDiv.classList.add('occupied');
                        }
                        // if selected (for state consistency on re-render, but we build once)
                        if (selectedSeats.has(seatId)) {
                            seatDiv.classList.add('selected');
                        }
                        seatDiv.dataset.seatId = seatId;
                        seatDiv.dataset.row = r;
                        seatDiv.dataset.col = c;
                        seatDiv.textContent = seatLabel(r, c);
                        seatDiv.addEventListener('click', seatClickHandler);
                        seatsGrid.appendChild(seatDiv);
                    }
                }
            }

            // ---------- SEAT CLICK HANDLER ----------
            function seatClickHandler(e) {
                const seatDiv = e.currentTarget;
                // ignore if occupied
                if (seatDiv.classList.contains('occupied')) return;

                const seatId = seatDiv.dataset.seatId;
                const row = parseInt(seatDiv.dataset.row);
                const col = parseInt(seatDiv.dataset.col);

                if (selectedSeats.has(seatId)) {
                    // deselect
                    selectedSeats.delete(seatId);
                    seatDiv.classList.remove('selected');
                } else {
                    // select (limit to max 6 seats for realism)
                    if (selectedSeats.size >= 6) {
                        alert('You can select up to 6 seats per booking.');
                        return;
                    }
                    selectedSeats.add(seatId);
                    seatDiv.classList.add('selected');
                }

                updateSummary();
            }

            // ---------- UPDATE SUMMARY PANEL ----------
            function updateSummary() {
                const count = selectedSeats.size;
                seatCountSpan.textContent = count;

                // update total
                const total = count * seatPrice;
                totalAmountSpan.textContent = `$${total}`;

                // update seat tags
                seatListDiv.innerHTML = '';
                if (count === 0) {
                    // optional: show placeholder
                    const emptyMsg = document.createElement('span');
                    emptyMsg.style.color = '#5f6580';
                    emptyMsg.style.fontSize = '0.9rem';
                    emptyMsg.style.fontStyle = 'italic';
                    emptyMsg.textContent = 'no seats selected';
                    seatListDiv.appendChild(emptyMsg);
                } else {
                    // sort seats for consistent display
                    const sorted = Array.from(selectedSeats).sort((a, b) => {
                        const [r1, c1] = a.split('-').map(Number);
                        const [r2, c2] = b.split('-').map(Number);
                        if (r1 !== r2) return r1 - r2;
                        return c1 - c2;
                    });
                    sorted.forEach(seatId => {
                        const [r, c] = seatId.split('-').map(Number);
                        const tag = document.createElement('span');
                        tag.className = 'seat-tag';
                        tag.textContent = seatLabel(r, c);
                        seatListDiv.appendChild(tag);
                    });
                }

                // update book button state (disabled if no seats)
                if (count === 0) {
                    bookBtn.style.opacity = '0.6';
                    bookBtn.style.pointerEvents = 'none';
                } else {
                    bookBtn.style.opacity = '1';
                    bookBtn.style.pointerEvents = 'auto';
                }
            }

            // ---------- MOVIE PILL SELECTION ----------
            moviePills.forEach(pill => {
                pill.addEventListener('click', () => {
                    // remove active from all
                    moviePills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    const movie = pill.dataset.movie;
                    movieNameSpan.textContent = movie;
                });
            });

            // ---------- BOOK BUTTON ----------
            bookBtn.addEventListener('click', () => {
                if (selectedSeats.size === 0) {
                    alert('Please select at least one seat.');
                    return;
                }

                // Build a friendly booking summary
                const movie = movieNameSpan.textContent;
                const seatsArray = Array.from(selectedSeats).sort((a, b) => {
                    const [r1, c1] = a.split('-').map(Number);
                    const [r2, c2] = b.split('-').map(Number);
                    if (r1 !== r2) return r1 - r2;
                    return c1 - c2;
                }).map(seatId => {
                    const [r, c] = seatId.split('-').map(Number);
                    return seatLabel(r, c);
                });

                const total = selectedSeats.size * seatPrice;

                // simulate booking (in a real app, this would go to a server)
                alert(`🎬 Booking confirmed!\n\nMovie: ${movie}\nSeats: ${seatsArray.join(', ')}\nTotal: $${total}\n\nEnjoy the show!`);

                // Mark selected seats as occupied (simulate that they are now taken)
                selectedSeats.forEach(seatId => {
                    occupiedSeats.add(seatId);
                });
                // Clear selection
                selectedSeats.clear();
                // re-render seats to reflect new occupancy and clear selection
                renderSeats();
                updateSummary();
            });

            // ---------- INITIAL RENDER ----------
            renderSeats();
            updateSummary();

            // set default movie (already Dune active by HTML, but ensure name matches)
            // not necessary, but safe
        })();
    </script>
</body>
</html>
